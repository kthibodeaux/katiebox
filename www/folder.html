<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/simple-v1.min.css">
    <title>Katiebox – Folder</title>
  </head>
  <body>
    <h1><a href="/">Katiebox</a></h1>
    <h2 id="folder-title">...</h2>

    <section>
      <form id="upload-form">
        <input id="upload-file" type="file" accept=".mp3,audio/mpeg" />
        <button id="upload-btn" type="submit">upload</button>
        <span id="upload-status"></span>
      </form>
    </section>

    <table>
      <thead>
        <tr>
          <th>File</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="file-list">
        <tr><td colspan="2">Loading...</td></tr>
      </tbody>
    </table>

    <script>
      function getQueryParam(name) {
        const params = new URLSearchParams(window.location.search)
        return params.get(name)
      }

      async function postRenameFile(folderName, currentFile, nextFile) {
        const body = new URLSearchParams({
          folder: folderName,
          current: currentFile,
          next: nextFile,
        })

        const res = await fetch("/api/rename_file.json", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: body.toString(),
        })

        if (!res.ok) {
          const text = await res.text()
          throw new Error(`HTTP ${res.status}: ${text}`)
        }

        return await res.json()
      }

      async function postDeleteFile(folderName, filename) {
        const body = new URLSearchParams({
          folder: folderName,
          name: filename,
        })

        const res = await fetch("/api/delete_file.json", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: body.toString(),
        })

        if (!res.ok) {
          const text = await res.text()
          throw new Error(`HTTP ${res.status}: ${text}`)
        }

        return await res.json()
      }

      async function postUploadMp3(folderName, file) {
        const fd = new FormData()
        fd.append("folder", folderName)
        fd.append("file", file, file.name)

        const res = await fetch("/api/upload_mp3", {
          method: "POST",
          body: fd,
        })

        if (!res.ok) {
          const text = await res.text()
          throw new Error(`HTTP ${res.status}: ${text}`)
        }

        return await res.json()
      }

      function enterEditMode({ tr, tdName, tdEdit, folderName, currentFile }) {
        const input = document.createElement("input")
        input.type = "text"
        input.value = currentFile
        input.size = Math.max(10, currentFile.length || 10)

        const go = document.createElement("a")
        go.href = "#"
        go.textContent = "go"

        const cancel = document.createElement("a")
        cancel.href = "#"
        cancel.textContent = "cancel"

        tdName.textContent = ""
        tdName.appendChild(input)

        tdEdit.textContent = ""
        tdEdit.appendChild(go)
        tdEdit.appendChild(document.createTextNode(" "))
        tdEdit.appendChild(cancel)

        const restoreView = (filenameText) => {
          tdName.textContent = filenameText

          tdEdit.textContent = ""
          const aEdit = document.createElement("a")
          aEdit.href = "#"
          aEdit.textContent = "edit"
          tdEdit.appendChild(aEdit)

          const aDelete = document.createElement("a")
          aDelete.href = "#"
          aDelete.textContent = "delete"
          tdEdit.appendChild(document.createTextNode(" "))
          tdEdit.appendChild(aDelete)

          aEdit.addEventListener("click", (e) => {
            e.preventDefault()
            enterEditMode({
              tr,
              tdName,
              tdEdit,
              folderName,
              currentFile: filenameText,
            })
          })

          aDelete.addEventListener("click", async (e) => {
            e.preventDefault()
            await maybeDeleteRow({ tr, folderName, filename: filenameText })
          })
        }

        cancel.addEventListener("click", (e) => {
          e.preventDefault()
          restoreView(currentFile)
        })

        const performRename = async () => {
          const nextFile = input.value.trim()
          if (nextFile.length === 0) {
            input.focus()
            return
          }

          if (nextFile === currentFile) {
            restoreView(nextFile)
            return
          }

          input.disabled = true
          go.textContent = "saving..."
          go.style.pointerEvents = "none"
          cancel.style.pointerEvents = "none"

          try {
            await postRenameFile(folderName, currentFile, nextFile)
            currentFile = nextFile
            restoreView(nextFile)
          } catch (err) {
            console.error(err)
            input.disabled = false
            go.textContent = "go"
            go.style.pointerEvents = ""
            cancel.style.pointerEvents = ""

            tdName.textContent = `Failed: ${err.message}`
            setTimeout(() => {
              tdName.textContent = ""
              tdName.appendChild(input)
              input.focus()
              input.select()
            }, 1200)
          }
        }

        go.addEventListener("click", (e) => {
          e.preventDefault()
          performRename()
        })

        input.addEventListener("keydown", (e) => {
          if (e.key === "Enter") performRename()
          if (e.key === "Escape") restoreView(currentFile)
        })

        input.focus()
        input.select()
      }

      async function maybeDeleteRow({ tr, folderName, filename }) {
        const ok = confirm(`Delete "${filename}"?`)
        if (!ok) return

        try {
          await postDeleteFile(folderName, filename)
          tr.remove()

          const tbody = document.getElementById("file-list")
          if (tbody && tbody.children.length === 0) {
            tbody.innerHTML = `<tr><td colspan="2">No files found.</td></tr>`
          }
        } catch (err) {
          console.error(err)
          alert(`Failed to delete: ${err.message}`)
        }
      }

      function addFileRow({ tbody, folderName, filename }) {
        // Remove "No files found." placeholder if present
        if (tbody.children.length === 1) {
          const onlyRow = tbody.children[0]
          if (onlyRow && onlyRow.textContent && onlyRow.textContent.includes("No files found")) {
            tbody.innerHTML = ""
          }
        }

        const tr = document.createElement("tr")

        const tdName = document.createElement("td")
        tdName.textContent = filename

        const tdEdit = document.createElement("td")

        const aEdit = document.createElement("a")
        aEdit.href = "#"
        aEdit.textContent = "edit"
        tdEdit.appendChild(aEdit)

        const aDelete = document.createElement("a")
        aDelete.href = "#"
        aDelete.textContent = "delete"
        tdEdit.appendChild(document.createTextNode(" "))
        tdEdit.appendChild(aDelete)

        aEdit.addEventListener("click", (e) => {
          e.preventDefault()
          enterEditMode({
            tr,
            tdName,
            tdEdit,
            folderName,
            currentFile: filename,
          })
        })

        aDelete.addEventListener("click", async (e) => {
          e.preventDefault()
          await maybeDeleteRow({ tr, folderName, filename })
        })

        tr.appendChild(tdName)
        tr.appendChild(tdEdit)
        tbody.appendChild(tr)
      }

      async function loadFolder() {
        const folderName = getQueryParam("name")
        const tbody = document.getElementById("file-list")
        const title = document.getElementById("folder-title")

        if (!folderName) {
          tbody.innerHTML = `<tr><td colspan="2">Missing folder name.</td></tr>`
          return
        }

        try {
          const res = await fetch(
            `/api/folder.json?name=${encodeURIComponent(folderName)}`,
            { cache: "no-store" }
          )
          if (!res.ok) throw new Error(`HTTP ${res.status}`)

          const data = await res.json()

          const canonicalFolderName = data.name || folderName

          if (data.uid) {
            title.textContent = data.description
              ? `${data.uid} – ${data.description}`
              : data.uid
          } else {
            title.textContent = canonicalFolderName
          }

          const files = Array.isArray(data.files) ? data.files : []

          if (files.length === 0) {
            tbody.innerHTML = `<tr><td colspan="2">No files found.</td></tr>`
          } else {
            tbody.innerHTML = ""
            for (const filename of files) {
              addFileRow({ tbody, folderName: canonicalFolderName, filename })
            }
          }

          // Wire upload form now that we know canonical folder name
          const form = document.getElementById("upload-form")
          const fileInput = document.getElementById("upload-file")
          const btn = document.getElementById("upload-btn")
          const status = document.getElementById("upload-status")

          form.addEventListener("submit", async (e) => {
            e.preventDefault()

            const file = fileInput.files && fileInput.files[0]
            if (!file) return

            // basic client-side check
            if (!file.name.toLowerCase().endsWith(".mp3")) {
              alert("Please select an .mp3 file")
              return
            }

            btn.disabled = true
            status.textContent = "uploading..."

            try {
              const result = await postUploadMp3(canonicalFolderName, file)
              status.textContent = "done"
              fileInput.value = ""

              // Add the row immediately
              addFileRow({ tbody, folderName: canonicalFolderName, filename: result.name || file.name })
            } catch (err) {
              console.error(err)
              status.textContent = "failed"
              alert(`Upload failed: ${err.message}`)
            } finally {
              btn.disabled = false
              setTimeout(() => { status.textContent = "" }, 1200)
            }
          })
        } catch (err) {
          console.error(err)
          tbody.innerHTML = `<tr><td colspan="2">Failed to load folder.</td></tr>`
        }
      }

      document.addEventListener("DOMContentLoaded", loadFolder)
    </script>
  </body>
</html>
